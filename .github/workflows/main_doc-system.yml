# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - doc-system

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install server dependencies
        run: npm install
        working-directory: .

      - name: Install client dependencies 
        run: npm install 
        working-directory: ./client

      - name: Build client 
        run: npm run build
        working-directory: ./client

      - name: Zip artifact for deployment
        run: zip -r release.zip ./*

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v3
        with:
          name: node-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: 'https://doc-system.azurewebsites.net/' 
    permissions:
      id-token: write # This is required for requesting the JWT

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v3
        with:
          name: node-app

      - name: Unzip artifact for deployment
        run: unzip release.zip
 
      - name: Login to Azure
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_46558E9D07AA41F3918BB42673A7B61B }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_3F77FB8820AB4AC2AC2AC298EC9D8CCD }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_30E1F24248D94BECB4F25C5D61E9C0A5 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'doc-system'
          slot-name: 'production'
          package: .
        env:
          MONGO_URL: ${{ secrets.MONGO_URL }}
          VITE_API_BASE_URL: 'https://doc-system.azurewebsites.net/'

